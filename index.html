function screenCards(s){return `<div class="captures ${s.customSteps?'four-steps':''}">${s.images.map((src,n)=>`<button class="capture" data-img="${n}" aria-label="Ampliar imagem ${n+1}"><span class="step-tag">${s.pages.length>1?'Passo '+(n+1+(s.stepOffset||0)):'Ver tela EVO'}${s.customSteps?'':' · pág. '+s.pages[n]}</span><img src="${src}" alt="Captura original da página ${s.pages[n]} do treinamento EVO" loading="eager"><span class="zoom-cue">↗ Ampliar</span></button>`).join('')}</div>`}
function content(s){if(s.type==='cover')return `<div class="slide-inner"><img class="official-logo" src="images/shared/logo.jpg" alt="Logo oficial Studio ECO" /><div class="eyebrow">STUDIO ECO · SAÚDE & FITNESS</div><h1>TREINAMENTO:<br><span class="green">PASSO A PASSO EVO</span></h1><p class="description">${safe(s.description)}</p><div class="hint">Use as setas do teclado ou os botões para começar →</div></div>`;if(s.type==='end')return `<div class="slide-inner end"><div class="eyebrow">STUDIO ECO · SAÚDE & FITNESS</div><div class="quote">“A eficiência é fazer melhor aquilo que já estamos fazendo.”</div><div class="small-source">— Peter Drucker</div><h2 class="green">OBRIGADO PELA ATENÇÃO DE TODOS</h2><img class="official-logo" src="images/shared/logo.jpg" alt="Logo oficial Studio ECO" /></div>`;if(s.type==='visual')return `<div class="slide-inner visual"><div class="eyebrow">${safe(s.section)} · Tutorial visual</div><h2>${safe(s.title)}</h2><p class="description">${safe(s.description)}</p>${screenCards(s)}</div>`;return `<div class="slide-inner"><div class="eyebrow">${safe(s.section)} · Como fazer</div><h2 class="green">${safe(s.title)}</h2><div class="route"><div class="little-label">Orientação no sistema EVO</div><p class="description">${safe(s.description)}</p></div>${s.type==='info'&&s.images.length===1?'<div class="hint">← Navegue para consultar o print do sistema →</div>':''}</div>`}
function go(i){if(i<0||i>=slides.length)return;active=i;document.querySelector('.top')?.classList.toggle('intro-clean',i===0);$('slide').classList.remove('active');setTimeout(()=>{$('slide').innerHTML=content(slides[i]);$('slide').classList.add('active');$('slide').querySelectorAll('[data-img]').forEach(el=>el.addEventListener('click',()=>showImage(Number(el.dataset.img))));},115);$('counter').textContent=`SLIDE ${String(i+1).padStart(2,'0')} / ${slides.length}`;$('progress').style.width=((i+1)/slides.length*100)+'%';$('prev').disabled=i===0;$('next').disabled=i===slides.length-1;$('dots').innerHTML=Array.from({length:9},(_,j)=>`<i class="${j===Math.min(8,Math.floor(i/slides.length*9))?'on':''}"></i>`).join('');history.replaceState(null,'','#slide-'+(i+1));}
function showImage(n){$('expandedImage').src=slides[active].images[n];$('lightboxTitle').textContent=`${slides[active].title} · ${slides[active].customSteps?'Passo '+(n+1):'página '+slides[active].pages[n]}`;$('lightbox').classList.add('open')}
function close(id){$(id).classList.remove('open')}
$('prev').onclick=()=>go(active-1);$('next').onclick=()=>go(active+1);$('indexButton').onclick=()=>{$('indexList').innerHTML=indexGroups.map(([title,desc,nums])=>`<section class="index-section"><div class="index-section-head"><h3>${safe(title)}</h3><span class="index-count">${nums.length} ${nums.length===1?'slide':'slides'}</span></div><p class="index-section-desc">${safe(desc)}</p><div class="index-section-items">${nums.map(n=>{const i=n-1;return `<button class="index-item ${i===active?'selected':''}" data-slide="${i}" ${i===active?'aria-current="true"':''}><span>${String(n).padStart(2,'0')}</span>${safe(slides[i].title)}</button>`}).join('')}</div></section>`).join('');$('indexList').querySelectorAll('[data-slide]').forEach(b=>b.onclick=()=>{close('indexModal');go(Number(b.dataset.slide))});$('indexModal').classList.add('open')};$('closeIndex').onclick=()=>close('indexModal');$('closeLightbox').onclick=()=>close('lightbox');['indexModal','lightbox'].forEach(id=>$(id).addEventListener('click',e=>{if(e.target===$(id))close(id)}));$('fullscreenButton').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()};document.addEventListener('keydown',e=>{if(e.key==='Escape'){close('indexModal');close('lightbox');return}if($('indexModal').classList.contains('open')||$('lightbox').classList.contains('open'))return;if(['ArrowRight',' ','PageDown'].includes(e.key)){e.preventDefault();go(active+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(active-1)}});go(Math.max(0,Math.min(slides.length-1,(parseInt(location.hash.replace('#slide-',''))||1)-1)));window.addEventListener('load',()=>setTimeout(()=>$('loader').classList.add('done'),850));setTimeout(()=>$('loader').classList.add('done'),2500);</script></body></html>
